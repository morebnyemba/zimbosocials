# ZimboSocials stack.
#
# Designed to sit ALONGSIDE the Slyker Tech stack on the same host: it binds
# only to 127.0.0.1, and the existing nginx (which owns 80/443 and the
# LetsEncrypt certs) proxies the domain to 127.0.0.1:${APP_PORT}. See
# docker/README-deploy.md.
#
# The big win over cPanel: real queue workers and a real scheduler, so the
# WhatsApp webhook stops doing AI calls inline.

services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-zimbosocials}
      MARIADB_USER: ${DB_USERNAME:-zimbosocials}
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      # Localhost only — never expose a database to the internet.
      - "127.0.0.1:${DB_PORT_HOST:-3307}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      # Log to the container's stderr, not a shared file. php-fpm runs as
      # www-data while the queue and scheduler run as root, and all three share
      # the storage_logs volume — whichever wrote first owned laravel.log, and
      # the others then got Permission denied. A failed log write throws, so an
      # admin reply would send the WhatsApp message and THEN 500 while trying to
      # record that it had. Read these with: docker compose logs -f app
      - LOG_CHANNEL=stderr
      - DB_HOST=db
      - DB_PORT=3306
    volumes:
      # Persist user uploads (payment proofs) and logs across rebuilds.
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    # Built, not a bare nginx image: it needs the same public/ directory the app
    # serves from, or every request 404s before reaching php-fpm.
    build:
      context: .
      target: web
    volumes:
      - storage_app:/var/www/html/storage/app:ro
    ports:
      # Loopback only — for checking the app directly on the host
      # (curl 127.0.0.1:8081). The public path does NOT use this: the Slyker
      # nginx reaches this container by name over the shared network below,
      # because a port published only on 127.0.0.1 is unreachable from inside
      # another container.
      - "127.0.0.1:${APP_PORT:-8081}:80"
    networks:
      default: {}
      slykertech:
        # Stable name for the proxy to target, regardless of container naming.
        aliases:
          - zimbosocials-web
    depends_on:
      - app
    restart: unless-stopped

  # Real queue worker — this is what removes the inline-webhook latency.
  # 'notifications' must be listed: campaigns and alerts ride that queue.
  queue:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      # stderr, for the same reason as the app service above.
      - LOG_CHANNEL=stderr
      - DB_HOST=db
      - DB_PORT=3306
    command: php artisan queue:work --queue=notifications,default --sleep=1 --tries=3 --max-time=3600
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Replaces the cPanel cron entry. schedule:work keeps running and fires each
  # due task itself, so there is no crontab to configure.
  scheduler:
    build:
      context: .
      target: app
    env_file: .env
    environment:
      # stderr, for the same reason as the app service above.
      - LOG_CHANNEL=stderr
      - DB_HOST=db
      - DB_PORT=3306
    command: php artisan schedule:work
    volumes:
      - storage_app:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db_data:
  storage_app:
  storage_logs:

networks:
  # The Slyker Tech stack's default network. Its nginx owns 80/443 and the
  # certs, and proxies this app — joining its network lets it reach us by name
  # without publishing a port on any host interface.
  slykertech:
    external: true
    name: ${PROXY_NETWORK:-slykertech_default}
